# Manual-only until GitHub Actions minutes are available (ADR-0005).
# To enable automatic runs, add `push` and `pull_request` triggers below.
name: CI

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # rustup on the runner installs the toolchain from rust-toolchain.toml.
      # `--locked` fails if Cargo.lock is out of date (ADR-0012, rule S2).
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked

  # Supply-chain policy in deny.toml (ADR-0012, rule S3).
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cargo install --locked cargo-deny@0.20.2
      - run: cargo deny check

  # The declared rust-version must build (ADR-0012, rule S5).
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install 1.85.0 --profile minimal
      - run: cargo +1.85.0 check --all-targets --locked
