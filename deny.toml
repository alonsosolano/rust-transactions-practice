# Supply-chain policy checked by `cargo deny check` (ADR-0012, rule S3).
# Reference: https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = false

# RustSec advisories. Vulnerabilities are always errors; unmaintained and
# unsound crates are errors for direct and transitive dependencies alike.
[advisories]
unmaintained = "all"
unsound = "all"
yanked = "deny"
ignore = []

# Only permissive licenses found in the current graph. A new license needs
# a reason in the ADR that adds the crate.
[licenses]
allow = ["Apache-2.0", "BSL-1.0", "MIT", "Unicode-3.0", "Unlicense"]
confidence-threshold = 0.93

# This crate sets `publish = false` and has no license of its own.
[licenses.private]
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = false
deny = []
skip = []

# crates.io only: no other registries and no git dependencies.
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
